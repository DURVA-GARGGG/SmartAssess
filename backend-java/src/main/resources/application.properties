server.port=8080

# Load DB credentials from backend/.env (not committed); see backend/.env.example
spring.config.import=optional:file:../backend/.env[.properties],optional:file:./backend/.env[.properties]
server.servlet.context-path=/

# MySQL DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_exam?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:super_secret_jwt_key_for_dbms_lab_spring_boot_3_secure_key_2026_at_least_256_bits_long}
jwt.expiration=86400000

# Judge0 Sandboxed Execution Configuration
# If judge0.enabled=true and api-key is set, calls Judge0; otherwise runs via safe LocalSandboxedExecutor fallback
judge0.enabled=false
judge0.api-url=https://judge0-ce.p.rapidapi.com
judge0.api-key=
judge0.api-host=judge0-ce.p.rapidapi.com

# Code Execution Settings
code.execution.timeout-seconds=3
code.execution.temp-dir=./temp_code_exec
