<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Smart Exam & Coding Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .testcase-row {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
        }
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>Admin Portal</h2>
        <div class="nav-links">
            <span id="userNameDisplay">Admin</span>
            <a onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Dashboard Overview</h1>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem;">
            <!-- Create Exam Section -->
            <div class="glass-panel">
                <h3>Create New Exam</h3>
                <div id="msgExam"></div>
                <form id="createExamForm">
                    <div class="form-group">
                        <label>Subject Name</label>
                        <input type="text" id="subject" required placeholder="e.g. Data Structures & Algorithms">
                    </div>
                    <div class="form-group">
                        <label>Exam Date & Time</label>
                        <input type="datetime-local" id="exam_date" required>
                    </div>
                    <div class="form-group">
                        <label>Duration (Minutes)</label>
                        <input type="number" id="duration" required value="60">
                    </div>
                    <div class="form-group">
                        <label>Total Marks</label>
                        <input type="number" id="total_marks" required value="100">
                    </div>
                    <div class="form-group">
                        <label>Negative Marking (e.g. 0.25)</label>
                        <input type="number" step="0.01" id="negative" value="0.0">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Create Exam</button>
                </form>
            </div>

            <!-- Add Question Section (MCQ or Coding) -->
            <div class="glass-panel">
                <h3>Add Question to Exam</h3>
                <div id="msgQuestion"></div>
                <form id="addQuestionForm">
                    <div class="form-group">
                        <label>Select Exam</label>
                        <select id="exam_id_select" required></select>
                    </div>

                    <div class="form-group">
                        <label>Question Type</label>
                        <select id="q_type" onchange="toggleQuestionTypeFields()">
                            <option value="MCQ" selected>Multiple Choice (MCQ)</option>
                            <option value="CODING">Coding Assessment (HackerRank)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Question Title / Text</label>
                        <input type="text" id="q_text" required placeholder="e.g. Reverse an Array">
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>Marks</label>
                            <input type="number" id="q_marks" value="5" required>
                        </div>
                        <div class="form-group">
                            <label>Difficulty</label>
                            <select id="q_difficulty">
                                <option value="EASY">EASY</option>
                                <option value="MEDIUM" selected>MEDIUM</option>
                                <option value="HARD">HARD</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Topic</label>
                            <input type="text" id="q_topic" value="General">
                        </div>
                    </div>

                    <!-- MCQ Section -->
                    <div id="mcqFields" style="margin-bottom: 1rem;">
                        <label style="color:var(--text-muted); font-size:0.9rem; margin-bottom:0.5rem; display:block;">Options (Select radio for correct answer)</label>
                        <div style="display:flex; gap:10px; margin-bottom:5px;">
                            <input type="radio" name="correct_opt" value="0" checked>
                            <input type="text" id="opt_0" placeholder="Option 1" required>
                        </div>
                        <div style="display:flex; gap:10px; margin-bottom:5px;">
                            <input type="radio" name="correct_opt" value="1">
                            <input type="text" id="opt_1" placeholder="Option 2" required>
                        </div>
                        <div style="display:flex; gap:10px; margin-bottom:5px;">
                            <input type="radio" name="correct_opt" value="2">
                            <input type="text" id="opt_2" placeholder="Option 3" required>
                        </div>
                        <div style="display:flex; gap:10px; margin-bottom:5px;">
                            <input type="radio" name="correct_opt" value="3">
                            <input type="text" id="opt_3" placeholder="Option 4" required>
                        </div>
                    </div>

                    <!-- Coding Question Section -->
                    <div id="codingFields" style="display:none; margin-bottom: 1.5rem;">
                        <div class="form-group">
                            <label>Problem Statement (Markdown / Text)</label>
                            <textarea id="q_problem_statement" rows="3" placeholder="Detailed problem description..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Constraints</label>
                            <textarea id="q_constraints" rows="2" placeholder="e.g. 1 <= N <= 10^5"></textarea>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div class="form-group">
                                <label>Input Format</label>
                                <textarea id="q_input_format" rows="2" placeholder="First line contains N..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Output Format</label>
                                <textarea id="q_output_format" rows="2" placeholder="Print the result..."></textarea>
                            </div>
                        </div>

                        <!-- Test Cases Builder -->
                        <div style="margin-top: 1rem;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                                <label style="font-weight:700; color:#60a5fa;">Test Cases</label>
                                <button type="button" class="btn" style="padding: 4px 10px; font-size: 0.8rem; background: rgba(96,165,250,0.2); color:#60a5fa;" onclick="addTestCaseRow()">+ Add Test Case</button>
                            </div>
                            <div id="testCasesContainer">
                                <!-- Dynamic test case rows inserted here -->
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-secondary" style="width: 100%;">Add Question</button>
                </form>
            </div>
        </div>

        <!-- High-level Results view -->
        <div class="glass-panel" style="margin-top: 2rem;">
            <h3>All Student Results</h3>
            <table>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Exam</th>
                        <th>Score</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth('Admin');

        function toggleQuestionTypeFields() {
            const type = document.getElementById('q_type').value;
            const mcqDiv = document.getElementById('mcqFields');
            const codingDiv = document.getElementById('codingFields');
            const optInputs = [document.getElementById('opt_0'), document.getElementById('opt_1'), document.getElementById('opt_2'), document.getElementById('opt_3')];

            if (type === 'CODING') {
                mcqDiv.style.display = 'none';
                codingDiv.style.display = 'block';
                optInputs.forEach(input => input.removeAttribute('required'));
                if (document.querySelectorAll('.testcase-row').length === 0) {
                    addTestCaseRow(true); // Add initial sample case
                    addTestCaseRow(false); // Add initial hidden case
                }
            } else {
                mcqDiv.style.display = 'block';
                codingDiv.style.display = 'none';
                optInputs.forEach(input => input.setAttribute('required', 'required'));
            }
        }

        let testCaseCount = 0;
        function addTestCaseRow(isSample = false) {
            testCaseCount++;
            const container = document.getElementById('testCasesContainer');
            const row = document.createElement('div');
            row.className = 'testcase-row';
            row.id = `tc_row_${testCaseCount}`;
            row.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <strong style="font-size:0.85rem; color:#e2e8f0;">Test Case #${testCaseCount}</strong>
                    <div style="display:flex; align-items:center; gap: 8px;">
                        <label style="font-size:0.8rem; color:var(--text-muted); cursor:pointer;">
                            <input type="checkbox" id="tc_sample_${testCaseCount}" ${isSample ? 'checked' : ''} style="width:auto;"> Sample (Visible to Student)
                        </label>
                        <button type="button" onclick="document.getElementById('tc_row_${testCaseCount}').remove()" style="background:transparent; border:none; color:#ef4444; cursor:pointer;">✕</button>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted);">Input:</span>
                        <textarea id="tc_input_${testCaseCount}" rows="2" style="font-family:monospace; font-size:0.85rem;" placeholder="Stdin data..." required></textarea>
                    </div>
                    <div>
                        <span style="font-size:0.75rem; color:var(--text-muted);">Expected Output:</span>
                        <textarea id="tc_output_${testCaseCount}" rows="2" style="font-family:monospace; font-size:0.85rem;" placeholder="Expected stdout..." required></textarea>
                    </div>
                </div>
            `;
            container.appendChild(row);
        }

        async function fetchExams() {
            try {
                const res = await fetch(API_BASE + '/admin/exams', { headers: getHeaders() });
                const data = await res.json();
                const select = document.getElementById('exam_id_select');
                select.innerHTML = '';
                data.forEach(ex => {
                    const opt = document.createElement('option');
                    opt.value = ex.examId || ex.exam_id;
                    opt.textContent = `${ex.subject} (ID: ${ex.examId || ex.exam_id})`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Failed to fetch exams:", e);
            }
        }

        async function fetchResults() {
            try {
                const res = await fetch(API_BASE + '/admin/results', { headers: getHeaders() });
                const data = await res.json();
                const tbody = document.getElementById('resultsTableBody');
                tbody.innerHTML = '';
                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted);">No student results available yet.</td></tr>';
                    return;
                }
                data.forEach(r => {
                    tbody.innerHTML += `<tr>
                        <td>${r.student_name}</td>
                        <td>${r.subject}</td>
                        <td><strong style="color: #6ee7b7">${r.score !== null ? r.score : 'Pending'}</strong></td>
                        <td><span class="status-tag status-${(r.result_status || 'pass').toLowerCase()}">${r.result_status || 'In Progress'}</span></td>
                    </tr>`;
                });
            } catch (e) {
                console.error("Failed to fetch results:", e);
            }
        }

        document.getElementById('createExamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                subject: document.getElementById('subject').value,
                exam_date: document.getElementById('exam_date').value.replace('T', ' '),
                duration_minutes: parseInt(document.getElementById('duration').value),
                total_marks: parseInt(document.getElementById('total_marks').value),
                negative_marking: parseFloat(document.getElementById('negative').value)
            };
            try {
                const res = await fetch(API_BASE + '/admin/exams', {
                    method: 'POST', headers: getHeaders(), body: JSON.stringify(payload)
                });
                if(res.ok) {
                    showMsg('msgExam', 'Exam created successfully!', false);
                    document.getElementById('createExamForm').reset();
                    fetchExams();
                } else {
                    const error = await res.json();
                    showMsg('msgExam', error.error || 'Failed to create exam', true);
                }
            } catch (err) {
                showMsg('msgExam', 'Connection failed: ' + err.message, true);
            }
        });

        document.getElementById('addQuestionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const exam_id = document.getElementById('exam_id_select').value;
            const qType = document.getElementById('q_type').value;

            const payload = {
                text: document.getElementById('q_text').value,
                marks: parseInt(document.getElementById('q_marks').value),
                question_type: qType,
                difficulty: document.getElementById('q_difficulty').value,
                topic: document.getElementById('q_topic').value
            };

            if (qType === 'CODING') {
                payload.problem_statement = document.getElementById('q_problem_statement').value;
                payload.constraints = document.getElementById('q_constraints').value;
                payload.input_format = document.getElementById('q_input_format').value;
                payload.output_format = document.getElementById('q_output_format').value;

                // Extract test cases
                const tcRows = document.querySelectorAll('.testcase-row');
                const testCases = [];
                tcRows.forEach(row => {
                    const id = row.id.replace('tc_row_', '');
                    const input = document.getElementById(`tc_input_${id}`).value;
                    const output = document.getElementById(`tc_output_${id}`).value;
                    const isSample = document.getElementById(`tc_sample_${id}`).checked;
                    testCases.push({
                        input_data: input,
                        expected_output: output,
                        is_sample: isSample,
                        weightage: 10
                    });
                });
                payload.test_cases = testCases;

                // Default starter templates
                payload.templates = [
                    { language: 'python', starter_code: 'import sys\n\ndef main():\n    # Read from standard input\n    pass\n\nif __name__ == "__main__":\n    main()' },
                    { language: 'java', starter_code: 'import java.util.*;\n\npublic class Solution {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        // Write solution here\n    }\n}' },
                    { language: 'cpp', starter_code: '#include <iostream>\nusing namespace std;\n\nint main() {\n    // Write solution here\n    return 0;\n}' },
                    { language: 'c', starter_code: '#include <stdio.h>\n\nint main() {\n    // Write solution here\n    return 0;\n}' },
                    { language: 'javascript', starter_code: 'const fs = require("fs");\n\nfunction main() {\n    const input = fs.readFileSync(0, "utf-8");\n    // Write solution here\n}\n\nmain();' }
                ];
            } else {
                const correctIdx = document.querySelector('input[name="correct_opt"]:checked').value;
                const options = [];
                for(let i=0; i<4; i++) {
                    options.push({
                        text: document.getElementById(`opt_${i}`).value,
                        is_correct: i == correctIdx
                    });
                }
                payload.options = options;
            }

            try {
                const res = await fetch(API_BASE + `/admin/exams/${exam_id}/questions`, {
                    method: 'POST', headers: getHeaders(), body: JSON.stringify(payload)
                });
                if(res.ok) {
                    showMsg('msgQuestion', `${qType} question added successfully!`, false);
                    document.getElementById('addQuestionForm').reset();
                    toggleQuestionTypeFields();
                } else {
                    const err = await res.json();
                    showMsg('msgQuestion', err.error || 'Failed to add question', true);
                }
            } catch (err) {
                showMsg('msgQuestion', 'Error adding question: ' + err.message, true);
            }
        });

        fetchExams();
        fetchResults();
    </script>
</body>
</html>
