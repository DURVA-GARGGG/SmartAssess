<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam in progress | Smart Exam</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Monaco Editor AMD Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
</head>
<body>
    <nav class="navbar exam-bar">
        <div class="exam-title">
            <span class="brand"><span class="brand-mark" aria-hidden="true">S</span><span id="examSubjectBadge">Exam</span></span>
        </div>
        <div class="nav-links">
            <span class="proctor-note" id="warningMsg">Stay on this tab. Tab switches are recorded.</span>
            <span id="timerDisplay" class="timer-chip" aria-live="polite">--:--</span>
            <button class="btn btn-primary btn-sm" onclick="confirmSubmitExam()">Finish exam</button>
        </div>
    </nav>

    <main class="container" style="max-width: 1400px; padding-top: 1.5rem;">
        <div id="msg"></div>

        <!-- Question navigator -->
        <div class="q-nav-strip" id="qNavStrip"></div>

        <!-- Current question -->
        <div id="questionDisplayArea">
            <div class="loading-spinner">Loading questions...</div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        checkAuth('Student');

        const attemptId = localStorage.getItem('active_attempt_id');
        const examId = localStorage.getItem('active_exam_id');

        if (!attemptId || !examId) {
            window.location.href = 'student.html';
        }

        let isSubmitting = false;
        let examQuestions = [];
        let currentQuestionIndex = 0;
        let monacoInstance = null;
        let studentAnswers = {}; // question_id -> option_id (for MCQ)
        let codingCodes = {};    // question_id -> { language: code }
        let monacoLoaded = false;
        let currentTheme = 'vs'; // light editor by default

        // Countdown timer. The server enforces the real limit (start_time + duration);
        // this shows the time left and auto-submits when it reaches zero.
        async function startTimer() {
            try {
                const res = await fetch(API_BASE + '/student/exams/available', { headers: getHeaders() });
                if (!res.ok) return;
                const exams = await res.json();
                const exam = exams.find(ex => String(ex.examId || ex.exam_id) === String(examId));
                if (!exam) return;

                const badge = document.getElementById('examSubjectBadge');
                if (badge && exam.subject) badge.textContent = exam.subject;

                const minutes = exam.durationMinutes || exam.duration_minutes;
                if (!minutes) return;

                // Keep the same deadline across page reloads for this attempt
                const key = 'exam_deadline_' + attemptId;
                let deadline = parseInt(localStorage.getItem(key), 10);
                if (!deadline) {
                    deadline = Date.now() + minutes * 60000;
                    localStorage.setItem(key, deadline);
                }

                const el = document.getElementById('timerDisplay');
                let timerId = null;
                const tick = () => {
                    const left = Math.max(0, deadline - Date.now());
                    const m = Math.floor(left / 60000);
                    const s = Math.floor((left % 60000) / 1000);
                    el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    el.classList.toggle('low', left <= 60000);
                    if (left === 0) {
                        clearInterval(timerId);
                        if (!isSubmitting) {
                            alert('Time is up. Your exam is being submitted now.');
                            submitExam();
                        }
                    }
                };
                timerId = setInterval(tick, 1000);
                tick();
            } catch (e) {
                console.error('Timer error:', e);
            }
        }

        // Initialize Monaco Editor Loader
        // If the CDN is unreachable, the page still works with a plain code box (see createPlainEditor)
        if (typeof require === 'function' && typeof require.config === 'function') {
            require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                const q = examQuestions[currentQuestionIndex];
                // Keep anything typed into the plain box before Monaco arrived
                if (q && q.question_type === 'CODING' && monacoInstance && document.getElementById('codeLangSelect')) {
                    const lang = document.getElementById('codeLangSelect').value;
                    if (!codingCodes[q.question_id]) codingCodes[q.question_id] = {};
                    codingCodes[q.question_id][lang] = monacoInstance.getValue();
                }
                monacoLoaded = true;
                if (q && q.question_type === 'CODING') {
                    initMonacoForQuestion(q);
                }
            });
        } else {
            console.warn('Code editor could not load; using a plain text box instead.');
        }

        // Fallback editor with the same methods the page uses on Monaco
        function createPlainEditor(elem, code) {
            elem.innerHTML = '<textarea class="plain-editor" spellcheck="false" aria-label="Code editor"></textarea>';
            const ta = elem.querySelector('textarea');
            ta.value = code;
            return { getValue: () => ta.value, setValue: v => { ta.value = v; }, dispose: () => {} };
        }

        // Tab Switch Proctoring
        document.addEventListener("visibilitychange", async () => {
            if (document.hidden && !isSubmitting) {
                try {
                    await fetch(API_BASE + '/proctor/logs', {
                        method: 'POST',
                        headers: getHeaders(),
                        body: JSON.stringify({ attempt_id: parseInt(attemptId), action: 'TAB_SWITCH' })
                    });
                } catch(e) {}
                alert('You left the exam tab. This has been recorded. More than 5 switches flags your attempt for review.');
            }
        });

        // Fetch Exam Questions
        async function loadExam() {
            try {
                const res = await fetch(API_BASE + `/student/exams/${examId}/questions`, { headers: getHeaders() });
                if (!res.ok) throw new Error('Failed to fetch exam questions');

                examQuestions = await res.json();
                if (examQuestions.length === 0) {
                    document.getElementById('questionDisplayArea').innerHTML = '<p class="panel">This exam has no questions yet. Ask your teacher to add some.</p>';
                    return;
                }

                renderQuestionNav();
                renderCurrentQuestion();
            } catch (err) {
                console.error("Error loading questions:", err);
                document.getElementById('msg').innerHTML = `<div class="alert error">Couldn't load the questions: ${err.message}</div>`;
            }
        }

        // Render Top Navigator Pills
        function renderQuestionNav() {
            const strip = document.getElementById('qNavStrip');
            strip.innerHTML = '';

            examQuestions.forEach((q, idx) => {
                const pill = document.createElement('button');
                pill.type = 'button';
                pill.className = `q-nav-pill ${idx === currentQuestionIndex ? 'active' : ''} ${studentAnswers[q.question_id] ? 'answered' : ''}`;
                const isCoding = q.question_type === 'CODING';
                pill.innerHTML = `
                    <span>Q${idx + 1}</span>
                    <span class="badge">${isCoding ? 'Code' : 'MCQ'}</span>
                `;
                pill.onclick = () => switchQuestion(idx);
                strip.appendChild(pill);
            });
        }

        function switchQuestion(idx) {
            // Save code in memory before switching if leaving a coding question
            if (monacoInstance && examQuestions[currentQuestionIndex].question_type === 'CODING') {
                const qId = examQuestions[currentQuestionIndex].question_id;
                const lang = document.getElementById('codeLangSelect').value;
                if (!codingCodes[qId]) codingCodes[qId] = {};
                codingCodes[qId][lang] = monacoInstance.getValue();
            }

            currentQuestionIndex = idx;
            renderQuestionNav();
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const container = document.getElementById('questionDisplayArea');
            const q = examQuestions[currentQuestionIndex];

            if (q.question_type === 'CODING') {
                renderCodingQuestion(q, container);
            } else {
                renderMCQQuestion(q, container);
            }
        }

        // Render MCQ Interface
        function renderMCQQuestion(q, container) {
            let optionsHtml = '';
            (q.options || []).forEach(opt => {
                const isChecked = studentAnswers[q.question_id] === opt.option_id;
                optionsHtml += `
                    <label class="option-lbl ${isChecked ? 'selected' : ''}" id="lbl_${opt.option_id}">
                        <input type="radio" name="mcq_opt_${q.question_id}" value="${opt.option_id}" 
                               ${isChecked ? 'checked' : ''}
                               onchange="handleOptionSelect(${q.question_id}, ${opt.option_id})">
                        ${escapeHtml(opt.option_text)}
                    </label>
                `;
            });

            const isFirst = currentQuestionIndex === 0;
            const isLast = currentQuestionIndex === examQuestions.length - 1;
            container.innerHTML = `
                <article class="panel sheet question-card">
                    <div class="q-head">
                        <h2>Question ${currentQuestionIndex + 1} <span class="muted" style="font-weight:500; font-size:1rem;">of ${examQuestions.length}</span></h2>
                        <div class="q-tags">
                            <span class="badge badge-${(q.difficulty || 'medium').toLowerCase()}">${(q.difficulty || 'MEDIUM').charAt(0) + (q.difficulty || 'MEDIUM').slice(1).toLowerCase()}</span>
                            <span class="badge badge-plain">${q.marks} ${q.marks == 1 ? 'mark' : 'marks'}</span>
                        </div>
                    </div>
                    <p class="q-text">${escapeHtml(q.question_text)}</p>
                    <div>${optionsHtml}</div>
                    <div class="q-actions">
                        <button class="btn" ${isFirst ? 'disabled' : ''} onclick="switchQuestion(${currentQuestionIndex - 1})">Previous</button>
                        <button class="btn btn-primary" ${isLast ? 'disabled' : ''} onclick="switchQuestion(${currentQuestionIndex + 1})">Next question</button>
                    </div>
                </article>
            `;
        }

        // Render HackerRank Coding Interface
        function renderCodingQuestion(q, container) {
            let sampleCasesHtml = '';
            (q.sample_test_cases || []).forEach((stc, sIdx) => {
                sampleCasesHtml += `
                    <div class="testcase-item block">
                        <strong>Example ${sIdx + 1}</strong>
                        <div class="case-label">Input</div>
                        <div class="pre-box">${escapeHtml(stc.input_data)}</div>
                        <div class="case-label">Expected output</div>
                        <div class="pre-box" style="margin-bottom:0;">${escapeHtml(stc.expected_output)}</div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="coding-container">
                    <!-- Left Pane: Problem Description -->
                    <div class="problem-pane">
                        <h2>${escapeHtml(q.question_text)}</h2>
                        <div class="meta-row">
                            <span class="badge badge-coding">Coding</span>
                            <span class="badge badge-${(q.difficulty || 'medium').toLowerCase()}">${(q.difficulty || 'MEDIUM').charAt(0) + (q.difficulty || 'MEDIUM').slice(1).toLowerCase()}</span>
                            <span class="badge badge-plain">${q.marks} marks</span>
                            <span class="badge badge-plain">${escapeHtml(q.topic || 'General')}</span>
                        </div>

                        <div class="section-title">Problem</div>
                        <p class="problem-text">${escapeHtml(q.problem_statement || q.question_text)}</p>

                        ${q.constraints ? `
                            <div class="section-title">Constraints</div>
                            <div class="pre-box">${escapeHtml(q.constraints)}</div>
                        ` : ''}

                        ${q.input_format ? `
                            <div class="section-title">Input format</div>
                            <div class="pre-box">${escapeHtml(q.input_format)}</div>
                        ` : ''}

                        ${q.output_format ? `
                            <div class="section-title">Output format</div>
                            <div class="pre-box">${escapeHtml(q.output_format)}</div>
                        ` : ''}

                        <div class="section-title">Examples</div>
                        ${sampleCasesHtml || '<p class="muted">No examples for this problem.</p>'}
                    </div>

                    <!-- Right Pane: Monaco Editor & Interactive Console -->
                    <div class="editor-pane">
                        <div class="editor-toolbar">
                            <div style="display:flex; align-items:center; gap: 10px;">
                                <label for="codeLangSelect">Language</label>
                                <select id="codeLangSelect" onchange="handleLanguageChange()">
                                    <option value="java">Java (OpenJDK)</option>
                                    <option value="python" selected>Python 3</option>
                                    <option value="cpp">C++ (g++)</option>
                                    <option value="c">C (gcc)</option>
                                    <option value="javascript">JavaScript (Node.js)</option>
                                </select>
                            </div>
                            <div style="display:flex; gap: 8px;">
                                <button class="btn btn-ghost btn-sm" onclick="resetStarterCode()">Reset code</button>
                                <button class="btn btn-ghost btn-sm" onclick="toggleEditorTheme(this)">Dark editor</button>
                            </div>
                        </div>

                        <!-- Monaco Editor Mount Point -->
                        <div id="monacoEditor"></div>

                        <!-- Interactive Terminal / Console Drawer -->
                        <div class="console-drawer">
                            <div class="console-nav">
                                <button class="console-tab-btn active" id="tabBtnCustom" onclick="switchConsoleTab('custom')">Your input</button>
                                <button class="console-tab-btn" id="tabBtnOutput" onclick="switchConsoleTab('output')">Output</button>
                                <button class="console-tab-btn" id="tabBtnSubmit" onclick="switchConsoleTab('submit')">Test results</button>
                            </div>

                            <div class="console-view active" id="viewCustom">
                                <textarea id="customInputText" aria-label="Custom input" placeholder="Type input for your program, then press Run code."></textarea>
                            </div>

                            <div class="console-view" id="viewOutput">
                                <div id="runOutputContainer" class="console-scroll">
                                    <span class="muted">Press Run code to see what your program prints.</span>
                                </div>
                            </div>

                            <div class="console-view" id="viewSubmit">
                                <div id="submitResultContainer" class="console-scroll">
                                    <span class="muted">Press Submit code to grade your solution against every test case.</span>
                                </div>
                            </div>
                        </div>

                        <!-- Action Bar -->
                        <div class="action-bar">
                            <button id="runCodeBtn" class="btn" onclick="runCandidateCode()">Run code</button>
                            <button id="submitCodeBtn" class="btn btn-primary" onclick="submitCandidateCode()">Submit code</button>
                        </div>
                    </div>
                </div>
            `;

            initMonacoForQuestion(q);
        }

        // Initialize / Update Monaco Editor
        function initMonacoForQuestion(q) {
            const editorElem = document.getElementById('monacoEditor');
            if (!editorElem) return;

            const langSelect = document.getElementById('codeLangSelect');
            const selectedLang = langSelect ? langSelect.value : 'python';

            let initialCode = getCodeForQuestionAndLang(q, selectedLang);

            if (monacoInstance) {
                monacoInstance.dispose();
            }

            if (!monacoLoaded) {
                monacoInstance = createPlainEditor(editorElem, initialCode);
                return;
            }

            editorElem.innerHTML = '';
            monacoInstance = monaco.editor.create(editorElem, {
                value: initialCode,
                language: getMonacoLangId(selectedLang),
                theme: currentTheme,
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false },
                scrollBeyondLastLine: false,
                tabSize: 4,
                roundedSelection: true
            });
        }

        function getMonacoLangId(lang) {
            switch(lang) {
                case 'python': return 'python';
                case 'java': return 'java';
                case 'javascript': return 'javascript';
                case 'cpp': return 'cpp';
                case 'c': return 'c';
                default: return 'plaintext';
            }
        }

        function getCodeForQuestionAndLang(q, lang) {
            const qId = q.question_id;
            if (codingCodes[qId] && codingCodes[qId][lang]) {
                return codingCodes[qId][lang];
            }
            if (q.templates && q.templates.length > 0) {
                const tmpl = q.templates.find(t => t.language.toLowerCase() === lang.toLowerCase());
                if (tmpl && tmpl.starter_code) {
                    return tmpl.starter_code;
                }
            }
            // Fallback default starter codes
            switch(lang) {
                case 'python': return '# Write your solution in Python 3\\nimport sys\\n\\ndef main():\\n    # Read input from standard input\\n    pass\\n\\nif __name__ == "__main__":\\n    main()';
                case 'java': return 'import java.util.*;\\n\\npublic class Solution {\\n    public static void main(String[] args) {\\n        Scanner sc = new Scanner(System.in);\\n        // Write your solution here\\n    }\\n}';
                case 'cpp': return '#include <iostream>\\nusing namespace std;\\n\\nint main() {\\n    // Write your solution here\\n    return 0;\\n}';
                case 'c': return '#include <stdio.h>\\n\\nint main() {\\n    // Write your solution here\\n    return 0;\\n}';
                case 'javascript': return 'const fs = require("fs");\\n\\nfunction main() {\\n    const input = fs.readFileSync(0, "utf-8");\\n    // Write your solution here\\n}\\n\\nmain();';
                default: return '';
            }
        }

        function handleLanguageChange() {
            const q = examQuestions[currentQuestionIndex];
            const lang = document.getElementById('codeLangSelect').value;
            const code = getCodeForQuestionAndLang(q, lang);
            if (monacoInstance) {
                if (monacoLoaded) monaco.editor.setModelLanguage(monacoInstance.getModel(), getMonacoLangId(lang));
                monacoInstance.setValue(code);
            }
        }

        function resetStarterCode() {
            if (!confirm('Replace your code with the starter template? Your current code for this language will be lost.')) return;
            const q = examQuestions[currentQuestionIndex];
            const lang = document.getElementById('codeLangSelect').value;
            delete codingCodes[q.question_id]?.[lang];
            const starter = getCodeForQuestionAndLang(q, lang);
            if (monacoInstance) {
                monacoInstance.setValue(starter);
            }
        }

        function toggleEditorTheme(btn) {
            if (!monacoLoaded) return;
            currentTheme = currentTheme === 'vs-dark' ? 'vs' : 'vs-dark';
            monaco.editor.setTheme(currentTheme);
            if (btn) btn.textContent = currentTheme === 'vs-dark' ? 'Light editor' : 'Dark editor';
        }

        function switchConsoleTab(tab) {
            document.querySelectorAll('.console-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.console-view').forEach(v => v.classList.remove('active'));

            if (tab === 'custom') {
                document.getElementById('tabBtnCustom').classList.add('active');
                document.getElementById('viewCustom').classList.add('active');
            } else if (tab === 'output') {
                document.getElementById('tabBtnOutput').classList.add('active');
                document.getElementById('viewOutput').classList.add('active');
            } else if (tab === 'submit') {
                document.getElementById('tabBtnSubmit').classList.add('active');
                document.getElementById('viewSubmit').classList.add('active');
            }
        }

        // Run Code against Custom Input
        async function runCandidateCode() {
            const btn = document.getElementById('runCodeBtn');
            const outputBox = document.getElementById('runOutputContainer');
            const q = examQuestions[currentQuestionIndex];
            const lang = document.getElementById('codeLangSelect').value;
            const sourceCode = monacoInstance ? monacoInstance.getValue() : '';
            const customInput = document.getElementById('customInputText').value;

            btn.disabled = true;
            btn.textContent = 'Running...';
            switchConsoleTab('output');
            outputBox.innerHTML = '<span class="muted">Running your code...</span>';

            try {
                const res = await fetch(API_BASE + '/student/code/run', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        question_id: q.question_id,
                        language: lang,
                        source_code: sourceCode,
                        custom_input: customInput
                    })
                });

                const data = await res.json();
                let html = '';

                if (data.status === 'SUCCESS') {
                    html = `
                        <div class="run-status ok">Ran successfully in ${data.executionTimeMs || 0} ms</div>
                        <div class="case-label">Output</div>
                        <div class="pre-box">${escapeHtml(data.stdout || '(no output)')}</div>
                    `;
                } else if (data.status === 'COMPILATION_ERROR') {
                    html = `
                        <div class="run-status bad">Didn't compile</div>
                        <div class="pre-box error">${escapeHtml(data.compileOutput || data.stderr)}</div>
                    `;
                } else if (data.status === 'TIMEOUT') {
                    html = `
                        <div class="run-status warn">Took too long (${data.executionTimeMs} ms)</div>
                        <div>Your program didn't finish within the time limit. Check for an infinite loop or a missing input read.</div>
                    `;
                } else {
                    html = `
                        <div class="run-status bad">Crashed while running</div>
                        <div class="pre-box error">${escapeHtml(data.stderr || data.error || data.message || 'The program stopped with an error.')}</div>
                    `;
                }

                outputBox.innerHTML = html;
            } catch (err) {
                outputBox.innerHTML = `<span class="run-status bad">Couldn't run your code: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run code';
            }
        }

        // Submit Code for Official Evaluation
        async function submitCandidateCode() {
            const btn = document.getElementById('submitCodeBtn');
            const submitBox = document.getElementById('submitResultContainer');
            const q = examQuestions[currentQuestionIndex];
            const lang = document.getElementById('codeLangSelect').value;
            const sourceCode = monacoInstance ? monacoInstance.getValue() : '';

            btn.disabled = true;
            btn.textContent = 'Grading...';
            switchConsoleTab('submit');
            submitBox.innerHTML = '<span class="muted">Grading against every test case...</span>';

            try {
                const res = await fetch(API_BASE + '/student/code/submit', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        attempt_id: parseInt(attemptId),
                        question_id: q.question_id,
                        language: lang,
                        source_code: sourceCode
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    submitBox.innerHTML = `<span class="run-status bad">${escapeHtml(data.message || data.error || 'Submission failed.')}</span>`;
                    return;
                }
                const verdicts = {
                    ACCEPTED: ['All tests passed', 'ok'],
                    WRONG_ANSWER: ['Some tests failed', 'warn'],
                    TIME_LIMIT_EXCEEDED: ['Too slow on some tests', 'warn'],
                    RUNTIME_ERROR: ['Crashed on some tests', 'bad'],
                    COMPILATION_ERROR: ["Didn't compile", 'bad']
                };
                const [verdictText, verdictClass] = verdicts[data.status] || [data.status, 'bad'];

                let html = `
                    <div class="submit-summary">
                        <div>
                            <span class="run-status ${verdictClass}" style="font-size:1.05rem;">${verdictText}</span>
                            <span class="muted" style="margin-left:0.5rem;">${data.passedTestCases} of ${data.totalTestCases} passed</span>
                        </div>
                        <span class="submit-score">${data.scoreObtained} / ${data.maxMarks} marks</span>
                    </div>
                `;

                (data.testCaseResults || []).forEach((tc, idx) => {
                    const passed = tc.status === 'PASSED';
                    html += `
                        <div class="testcase-item">
                            <span>${tc.isSample ? 'Example' : 'Hidden test'} ${idx + 1}</span>
                            <div>
                                <span class="status-tag status-${tc.status.toLowerCase()}">${tc.status.charAt(0) + tc.status.slice(1).toLowerCase()}</span>
                                <span class="muted" style="font-size:0.8rem; margin-left:0.4rem;">${tc.executionTimeMs || 0} ms</span>
                            </div>
                        </div>
                    `;
                });

                submitBox.innerHTML = html;

                // Mark current question pill as answered
                const pills = document.querySelectorAll('.q-nav-pill');
                if (pills[currentQuestionIndex]) {
                    pills[currentQuestionIndex].classList.add('answered');
                }
            } catch (err) {
                submitBox.innerHTML = `<span class="run-status bad">Couldn't submit: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit code';
            }
        }

        // Save MCQ Response
        async function handleOptionSelect(questionId, optionId) {
            studentAnswers[questionId] = optionId;
            document.querySelectorAll(`[id^="lbl_"]`).forEach(el => el.classList.remove('selected'));
            const selLbl = document.getElementById(`lbl_${optionId}`);
            if (selLbl) selLbl.classList.add('selected');

            try {
                const res = await fetch(API_BASE + '/student/responses', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({
                        attempt_id: parseInt(attemptId),
                        question_id: questionId,
                        selected_option_id: optionId
                    })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    showMsg('msg', err.message || err.error || 'Your answer was not saved. Try selecting it again.', true);
                    return;
                }

                // Mark navigation pill
                const pills = document.querySelectorAll('.q-nav-pill');
                if (pills[currentQuestionIndex]) {
                    pills[currentQuestionIndex].classList.add('answered');
                }
            } catch(e) {
                console.error("Error saving response:", e);
                showMsg('msg', "Your answer was not saved because the server can't be reached.", true);
            }
        }

        // Submit Full Exam
        function confirmSubmitExam() {
            if (!confirm("Finish the exam now? You can't change your answers after this.")) {
                return;
            }
            submitExam();
        }

        async function submitExam() {
            try {
                isSubmitting = true;
                const res = await fetch(API_BASE + `/student/exams/${attemptId}/submit`, {
                    method: 'POST',
                    headers: getHeaders()
                });
                if (res.ok) {
                    localStorage.removeItem('exam_deadline_' + attemptId);
                    localStorage.removeItem('active_attempt_id');
                    localStorage.removeItem('active_exam_id');
                    window.location.href = 'result.html';
                } else {
                    isSubmitting = false;
                    const err = await res.json();
                    alert(err.error || err.message || 'Could not submit the exam. Try again.');
                }
            } catch(e) {
                isSubmitting = false;
                alert('Error submitting exam: ' + e.message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Load exam on start
        loadExam();
        startTimer();
    </script>
</body>
</html>
