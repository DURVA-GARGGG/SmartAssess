<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Smart Exam</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-wrap">
        <div class="auth-box">
            <div class="auth-brand">
                <span class="brand"><span class="brand-mark" aria-hidden="true">S</span>Smart Exam</span>
            </div>
            <div class="panel">
                <h1 id="formTitle">Welcome back</h1>
                <p class="muted" id="formSub" style="margin-bottom: 1.5rem;">Sign in to see your exams and results.</p>

                <div id="msg" role="status"></div>

                <form id="authForm">
                    <div class="form-group" id="nameGroup" style="display:none;">
                        <label for="name">Full name</label>
                        <input type="text" id="name" placeholder="Your name" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required placeholder="name@college.edu" autocomplete="email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="Your password" autocomplete="current-password">
                    </div>
                    <div class="form-group" id="roleGroup" style="display:none;">
                        <label for="role_id">I am a</label>
                        <select id="role_id">
                            <option value="2">Student</option>
                            <option value="1">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
                </form>
            </div>
            <p class="toggle-text"><span id="toggleLead">New here?</span> <button type="button" id="toggleMode">Create an account</button></p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        let isLogin = true;
        
        document.getElementById('toggleMode').addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('formTitle').innerText = isLogin ? 'Welcome back' : 'Create your account';
            document.getElementById('formSub').innerText = isLogin ? 'Sign in to see your exams and results.' : 'Students take exams; admins create them.';
            document.getElementById('submitBtn').innerText = isLogin ? 'Sign in' : 'Create account';
            document.getElementById('toggleLead').innerText = isLogin ? 'New here?' : 'Already have an account?';
            document.getElementById('toggleMode').innerText = isLogin ? 'Create an account' : 'Sign in';
            document.getElementById('password').autocomplete = isLogin ? 'current-password' : 'new-password';
            document.getElementById('nameGroup').style.display = isLogin ? 'none' : 'block';
            document.getElementById('roleGroup').style.display = isLogin ? 'none' : 'block';
            document.getElementById('msg').className = 'alert';
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const payload = { email, password };

            const endpoint = isLogin ? '/auth/login' : '/auth/register';
            if (!isLogin) {
                payload.name = document.getElementById('name').value;
                payload.role_id = parseInt(document.getElementById('role_id').value);
            }

            try {
                const res = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    if (isLogin) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('role', data.role);
                        localStorage.setItem('name', data.name);
                        
                        // Redirect based on role
                        if(data.role === 'Admin') window.location.href = 'admin.html';
                        else window.location.href = 'student.html';
                    } else {
                        document.getElementById('toggleMode').click(); // Switch to sign in
                        showMsg('msg', 'Account created. Sign in to continue.', false);
                    }
                } else {
                    showMsg('msg', data.error || data.message || 'Error occurred', true);
                }
            } catch (err) {
                showMsg('msg', 'Can\'t reach the server. Check that the backend is running on port 8080.', true);
            }
        });
    </script>
</body>
</html>
