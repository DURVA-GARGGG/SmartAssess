<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My results | Smart Exam</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="student.html"><span class="brand-mark" aria-hidden="true">S</span>Smart Exam</a>
        <div class="nav-links">
            <span id="userNameDisplay" class="user-chip">Student</span>
            <a href="student.html">Your exams</a>
            <a href="#" onclick="logout(); return false;">Sign out</a>
        </div>
    </nav>

    <main class="container">
        <header class="page-head">
            <h1>My results</h1>
            <p class="lede">Scores include negative marking and your best submission for each coding question. You pass with 40% of the total marks. Switching tabs more than 5 times during an exam makes that result invalid.</p>
        </header>
        <div class="panel table-wrap accent-lemon">
            <table>
                <thead>
                    <tr>
                        <th>Exam</th>
                        <th>Score</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr><td colspan="3" class="empty">Loading results...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        checkAuth('Student');

        async function loadResults() {
            try {
                const res = await fetch(API_BASE + '/student/results', { headers: getHeaders() });
                const results = await res.json();
                const tbody = document.getElementById('resultBody');

                if (!Array.isArray(results) || results.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="empty">No results yet. Finish an exam and your score appears here.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                results.forEach(r => {
                    const status = r.result_status || r.resultStatus || 'Under Review';
                    const isPass = status === 'PASS' || status === 'AUTO_GENERATED';
                    const score = r.score !== null && r.score !== undefined ? r.score : 'Pending';

                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:600;">${r.subject}</td>
                            <td class="score">${score}</td>
                            <td>
                                <span class="status-tag status-${status.toLowerCase().split(' ')[0]}">${status === 'PASS' ? 'Pass' : status === 'FAIL' ? 'Fail' : status === 'INVALID' ? 'Invalid: more than 5 tab switches' : status}</span>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                document.getElementById('resultBody').innerHTML = 
                    `<tr><td colspan="3" class="empty" style="color:var(--bad);">Couldn't load results: ${err.message}</td></tr>`;
            }
        }

        loadResults();
    </script>
</body>
</html>
