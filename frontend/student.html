<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your exams | Smart Exam</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="student.html"><span class="brand-mark" aria-hidden="true">S</span>Smart Exam</a>
        <div class="nav-links">
            <span id="userNameDisplay" class="user-chip">Student</span>
            <a href="result.html">My results</a>
            <a href="#" onclick="logout(); return false;">Sign out</a>
        </div>
    </nav>

    <main class="container">
        <header class="page-head">
            <h1>Your exams</h1>
            <p class="lede">Pick an exam to begin. The timer starts when you open it, and switching tabs during the exam is recorded.</p>
        </header>
        <div id="msg"></div>

        <ul id="examList" class="exam-list">
            <li class="exam-row"><span class="muted">Loading exams...</span></li>
        </ul>
    </main>

    <script src="js/api.js"></script>
    <script>
        checkAuth('Student');

        async function fetchAvailableExams() {
            try {
                const res = await fetch(API_BASE + '/student/exams/available', {
                    headers: getHeaders()
                });

                if (!res.ok) {
                    const err = await res.json();
                    document.getElementById('examList').innerHTML =
                        `<li class="exam-row"><span class="alert error" style="margin:0;">${err.message || err.error || 'Could not load exams. Try signing in again.'}</span></li>`;
                    return;
                }

                const exams = await res.json();
                const container = document.getElementById('examList');
                container.innerHTML = '';

                if (exams.length === 0) {
                    container.innerHTML = '<li class="exam-row"><span class="muted">No exams are scheduled yet. Check back once your teacher publishes one.</span></li>';
                    return;
                }

                exams.forEach(ex => {
                    const examId = ex.examId || ex.exam_id;
                    const duration = ex.durationMinutes || ex.duration_minutes;
                    const marks = ex.totalMarks || ex.total_marks;
                    const negative = ex.negativeMarking != null ? ex.negativeMarking : (ex.negative_marking != null ? ex.negative_marking : 0);

                    const card = document.createElement('li');
                    card.className = 'exam-row';
                    const negativeText = Number(negative) > 0 ? `minus ${negative} per wrong answer` : 'no negative marking';

                    card.innerHTML = `
                        <div>
                            <h3>${ex.subject}</h3>
                            <div class="exam-facts">
                                <span><strong>${duration}</strong> minutes</span>
                                <span><strong>${marks}</strong> marks</span>
                                <span>${negativeText}</span>
                            </div>
                        </div>
                        <button onclick="startExam(${examId})" class="btn btn-primary">Start exam</button>
                    `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Fetch failed:", err);
                document.getElementById('examList').innerHTML =
                    `<li class="exam-row"><span class="alert error" style="margin:0;">Can't reach the server at ${API_BASE}. Check that the backend is running.</span></li>`;
            }
        }

        async function startExam(exam_id) {
            try {
                const res = await fetch(API_BASE + `/student/exams/${exam_id}/start`, {
                    method: 'POST',
                    headers: getHeaders()
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('active_attempt_id', data.attempt_id);
                    localStorage.setItem('active_exam_id', exam_id);
                    window.location.href = 'exam.html';
                } else {
                    const err = await res.json();
                    alert(err.error || err.message || 'Unable to start examination.');
                }
            } catch (err) {
                alert('Connection error: ' + err.message);
            }
        }

        fetchAvailableExams();
    </script>
</body>
</html>
